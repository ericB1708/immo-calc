<div class="calc-form">
  <p>Objekt & Finanzierung</p>
  <app-input-container
    inputName="Eigenkapital (€)"
    [placeHolderValue]="1000000"
    [value]="calcDataService.immoDataSignal().eigenkapital"
    (valueChange)="calcDataService.updateValue('eigenkapital', $event)"
  ></app-input-container>
  <app-input-container
    inputName="Kaufpreis (€)"
    [placeHolderValue]="578000"
    [value]="calcDataService.immoDataSignal().kaufpreis"
    (valueChange)="calcDataService.updateValue('kaufpreis', $event)"
  ></app-input-container>
  <app-input-container
    inputName="Wohnfläche (m²)"
    [placeHolderValue]="280"
    [value]="calcDataService.immoDataSignal().wohnflaeche"
    (valueChange)="calcDataService.updateValue('wohnflaeche', $event)"
  ></app-input-container>
  <app-input-container
    inputName="Miete/m² (€)"
    [placeHolderValue]="8.5"
    [value]="calcDataService.immoDataSignal().mieteProQm"
    (valueChange)="calcDataService.updateValue('mieteProQm', $event)"
  ></app-input-container>
  <p>Instandhaltung</p>
  <div class="slider-container">
    <app-input-container
      inputName="€ Pro QM"
      [placeHolderValue]="2.0"
      [value]="calcDataService.immoDataSignal().instandhaltungProQw"
      [higlightTitle]="!calcDataService.immoDataSignal().instandhaltungisPauschal"
      (valueChange)="calcDataService.updateValue('instandhaltungProQw', $event)"
    ></app-input-container>
    <mat-slide-toggle
      color="primary"
      class="example-margin"
      [checked]="calcDataService.immoDataSignal().instandhaltungisPauschal"
      (change)="calcDataService.updateValue('instandhaltungisPauschal', $event.checked)"
      [disabled]="false"
    >
    </mat-slide-toggle>
    <app-input-container
      inputName="€ Pauschal"
      [placeHolderValue]="300"
      [value]="calcDataService.immoDataSignal().instandhaltungPauschal"
      [higlightTitle]="calcDataService.immoDataSignal().instandhaltungisPauschal"
      (valueChange)="calcDataService.updateValue('instandhaltungPauschal', $event)"
    ></app-input-container>
  </div>
  <p>Bank</p>
  <app-input-container
    inputName="Zinssatz (%)"
    [placeHolderValue]="4"
    [value]="calcDataService.immoDataSignal().zinssatz"
    (valueChange)="calcDataService.updateValue('zinssatz', $event)"
  ></app-input-container>
  <app-input-container
    inputName="Tilgung (%)"
    [placeHolderValue]="1.5"
    [value]="calcDataService.immoDataSignal().tilgung"
    (valueChange)="calcDataService.updateValue('tilgung', $event)"
  ></app-input-container>
  <p>Kaufnebenkosten</p>
  <app-input-container
    inputName="Grunderwerbsteuer (%)"
    [placeHolderValue]="5"
    [value]="calcDataService.immoDataSignal().grunderwerbsteuer"
    (valueChange)="calcDataService.updateValue('grunderwerbsteuer', $event)"
  ></app-input-container>
  <app-input-container
    inputName="Notar & Grundbuch (%)"
    [placeHolderValue]="2"
    [value]="calcDataService.immoDataSignal().notarUndGrundbuch"
    (valueChange)="calcDataService.updateValue('notarUndGrundbuch', $event)"
  ></app-input-container>
  <app-input-container
    inputName="Maklerprovision (%)"
    [placeHolderValue]="4.2"
    [value]="calcDataService.immoDataSignal().maklerprovision"
    (valueChange)="calcDataService.updateValue('maklerprovision', $event)"
  ></app-input-container>

  <button (click)="onClickbuttonCalc()">BERECHNEN</button>
</div>
