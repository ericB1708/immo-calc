<h2 *ngIf="!isHeading" mat-dialog-title class="custom-dialog-title">Todo bearbeiten</h2>
<h2 *ngIf="isHeading" mat-dialog-title class="custom-dialog-title">Kategorie bearbeiten</h2>

<mat-dialog-content class="create-todo-container">
  <div *ngIf="isHeading" class="form-section">
    <div class="input-group">
      <p class="input-label">Kategorie Name</p>
      <input [(ngModel)]="newHeadingName" type="text" class="custom-input" />
    </div>

    <p *ngIf="!headingEditCorrect" class="error-message">Name leer oder existiert schon.</p>

    <div class="dialog-actions">
      <button class="btn-cancel" (click)="closeDialog()">Abbrechen</button>
      <button class="btn-submit" (click)="onClickEditHeading()">Fertig</button>
    </div>
  </div>

  <div *ngIf="!isHeading" class="form-section">
    <div class="input-group">
      <p class="input-label">Todo Name</p>
      <input [(ngModel)]="newNameTodo" type="text" class="custom-input" />
    </div>

    <div class="input-group">
      <p class="input-label">Kategorie</p>
      <select [(ngModel)]="selectedOption" class="custom-select">
        <option *ngFor="let heading of immoTodoService.headings()" [value]="heading">
          {{ heading }}
        </option>
      </select>
    </div>

    <p *ngIf="!todoEditCorrect" class="error-message">Name leer oder Kategorie existiert nicht.</p>

    <div class="dialog-actions">
      <button class="btn-cancel" (click)="closeDialog()">Abbrechen</button>
      <button class="btn-submit" (click)="onClickEditTodo()">Fertig</button>
    </div>
  </div>
</mat-dialog-content>
