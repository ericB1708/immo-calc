<h2 mat-dialog-title class="custom-dialog-title">Todo / Kategorie erstellen</h2>

<mat-dialog-content class="create-todo-container">
  <div class="toggle-section">
    <mat-slide-toggle color="primary" [checked]="isHeading" (change)="isHeading = !isHeading">
      <span class="toggle-text">{{ isHeading ? 'Kategorie Modus' : 'Todo Modus' }}</span>
    </mat-slide-toggle>
  </div>

  <div *ngIf="!isHeading" class="form-section">
    <div class="input-group">
      <p class="input-label">Todo Name</p>
      <input
        [(ngModel)]="nameTodo"
        type="text"
        placeholder="z.B. Schimmel prüfen"
        class="custom-input"
      />
    </div>

    <div class="input-group">
      <p class="input-label">Kategorie auswählen</p>
      <select [(ngModel)]="selectedOption" class="custom-select">
        <option *ngFor="let heading of immoTodoService.headings()" [value]="heading">
          {{ heading }}
        </option>
      </select>
    </div>

    <p *ngIf="!todoCreateCorrect" class="error-message">Bitte fülle alle Felder aus.</p>

    <div class="dialog-actions">
      <button class="btn-cancel" (click)="closeDialog()">Abbrechen</button>
      <button class="btn-submit" (click)="onClickCreateTodo()">Todo hinzufügen</button>
    </div>
  </div>

  <div *ngIf="isHeading" class="form-section">
    <div class="input-group">
      <p class="input-label">Name der neuen Kategorie</p>
      <input
        [(ngModel)]="nameHeader"
        type="text"
        placeholder="z.B. Außenbereich"
        class="custom-input"
      />
    </div>

    <p *ngIf="!todoCreateCorrect" class="error-message">Bitte gib einen Namen ein.</p>

    <div class="dialog-actions">
      <button class="btn-cancel" (click)="closeDialog()">Abbrechen</button>
      <button class="btn-submit" (click)="onClickCreateHeader()">Kategorie hinzufügen</button>
    </div>
  </div>
</mat-dialog-content>
